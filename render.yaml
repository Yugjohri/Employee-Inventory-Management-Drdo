# Render deployment blueprint.
#
# Render reads this file when you create a "Blueprint" from the repository and
# provisions everything described here — the web service and its database —
# without any manual configuration.
#
# This is for a PUBLIC demo copy of the application. The DRDO deployment runs
# on the intranet with no internet access; see the Deployment section of
# README.md. Do not put real personnel records on a hosted service.

services:
  - type: web
    name: employee-inventory
    runtime: node
    plan: free
    # Singapore is Render's closest region to India.
    region: singapore

    # Both defined in the root package.json. Build installs and builds the
    # frontend (which must happen before the backend starts, since the backend
    # serves frontend/dist), then installs the backend. Start applies the
    # schema, seeds the demo data — both idempotent — and runs the server.
    buildCommand: npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      # The database below, injected by Render.
      - key: DATABASE_URL
        fromDatabase:
          name: employee-inventory-db
          property: connectionString

      # Note there is deliberately no PGUSER here.
      #
      # Locally the API connects as a separate unprivileged role, `eims_app`,
      # so that PostgreSQL's row-level security applies to it — an owner is
      # exempt from its own policies. A managed database won't let us create
      # that role, so here the API connects as the DATABASE_URL user and the
      # schema instead marks every table FORCE ROW LEVEL SECURITY, which makes
      # the policies apply to the owner as well. Both routes end up enforced;
      # see backend/src/dbConfig.js.

      # Signs the session cookie. Generated once by Render and kept secret.
      - key: JWT_SECRET
        generateValue: true

      # Makes the session cookie Secure, which is correct here because Render
      # serves over HTTPS. It stays off for plain-HTTP intranet deployments.
      - key: NODE_ENV
        value: production

      # Password for the seeded demo accounts. Change it here if you'd rather
      # the public copy didn't use the one documented in the README.
      - key: DEFAULT_PASSWORD
        value: drdo@1234

databases:
  - name: employee-inventory-db
    plan: free
    region: singapore
    databaseName: eims
